name: Publish Docker image (Docker Hub)

on:
  push:
    branches: ["main"]
    paths:
      - "astrbot-docs-agent-server/**"
      - ".github/workflows/dockerhub-publish.yml"
  workflow_dispatch:
    inputs:
      image:
        description: "Docker Hub image (username/repo), e.g. xunxiing/astrbot-docs-agent"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: dockerhub-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ inputs.image || format('{0}/{1}', secrets.DOCKERHUB_USERNAME, 'astrbot-docs-agent-server') }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./astrbot-docs-agent-server
          file: ./astrbot-docs-agent-server/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
