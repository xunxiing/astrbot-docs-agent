services:
  astrbot-docs-agent:
    image: ${IMAGE:-xunxiing/astrbot-docs-agent-server:latest}
    container_name: astrbot-docs-agent
    restart: unless-stopped
    pull_policy: always
    env_file:
      - .env
    ports:
      - "${HOST_PORT:-8787}:${PORT:-8787}"
    volumes:
      - astrbot-docs-agent-data:/data
      - ./secrets:/secrets:ro
    extra_hosts:
      # Allow reaching the host proxy from inside the container (Docker 20.10+)
      - "host.docker.internal:host-gateway"

volumes:
  astrbot-docs-agent-data:

