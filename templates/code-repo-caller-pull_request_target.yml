name: AstrBot Docs Agent (caller, pull_request_target)

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited]

jobs:
  call-docs-agent:
    uses: <OWNER>/<THIS_REPO>/.github/workflows/astrbot-docs-agent.yml@main
    with:
      code_repo: ${{ github.repository }}
      docs_repo: <OWNER>/<DOCS_REPO>
      pr_number: ${{ github.event.pull_request.number }}
    secrets:
      GH_APP_ID: ${{ secrets.GH_APP_ID }}
      GH_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
      OPENCODE_BASE_URL: ${{ secrets.OPENCODE_BASE_URL }}
      MY_API_KEY: ${{ secrets.MY_API_KEY }}
      OPENCODE_MODEL: ${{ secrets.OPENCODE_MODEL }}

